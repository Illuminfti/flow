[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow"
version = "1.3.0"
description = "A generic dynamic-workflow engine for any agent, any model — concurrent leaves, cost-aware routing, schema enforcement, crash-resume."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "flow contributors" }]
keywords = ["llm", "agents", "workflow", "orchestration", "concurrency", "ai", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # core is stdlib-only (urllib HTTP backend)

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
anthropic = ["anthropic>=0.40"]
http = ["httpx>=0.27"]
schema = ["jsonschema>=4"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "PyYAML>=6", "jsonschema>=4"]
all = ["PyYAML>=6", "anthropic>=0.40", "httpx>=0.27", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/Illuminfti/flow"
Repository = "https://github.com/Illuminfti/flow"
Issues = "https://github.com/Illuminfti/flow/issues"

[project.scripts]
flow = "flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: hits real provider/OAuth endpoints; needs credentials (run with -m live)"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
ignore = ["E402", "E741"]
