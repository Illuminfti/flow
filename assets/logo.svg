<svg width="520" height="150" viewBox="0 0 520 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="flow">
  <defs>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- mark: four parallel streams fan in and converge to one shipped node -->
  <g transform="translate(16,15)" fill="none" stroke="url(#flowGrad)" stroke-linecap="round">
    <path d="M14 22 C 58 22, 70 60, 104 60" stroke-width="6" opacity="0.95"/>
    <path d="M14 47 C 58 47, 74 60, 104 60" stroke-width="6" opacity="0.80"/>
    <path d="M14 73 C 58 73, 74 60, 104 60" stroke-width="6" opacity="0.80"/>
    <path d="M14 98 C 58 98, 70 60, 104 60" stroke-width="6" opacity="0.95"/>
    <circle cx="14" cy="22" r="5.5" fill="url(#flowGrad)" stroke="none"/>
    <circle cx="14" cy="47" r="5.5" fill="url(#flowGrad)" stroke="none" opacity="0.85"/>
    <circle cx="14" cy="73" r="5.5" fill="url(#flowGrad)" stroke="none" opacity="0.85"/>
    <circle cx="14" cy="98" r="5.5" fill="url(#flowGrad)" stroke="none"/>
    <circle cx="104" cy="60" r="13" fill="url(#flowGrad)" stroke="none"/>
    <circle cx="104" cy="60" r="5" fill="#ffffff" stroke="none"/>
  </g>

  <!-- wordmark -->
  <text x="166" y="100" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="92" font-weight="800" letter-spacing="-3" fill="url(#flowGrad)">flow</text>
</svg>
