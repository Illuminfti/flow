name: live-tests
# Credential-gated: hits real provider endpoints. Runs only when secrets exist;
# otherwise skips clean. The kill-resume smoke needs no credentials and always runs.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly
jobs:
  kill-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/test_live_resume.py -v
  # The secrets context is not available in a job-level `if` — gate via a
  # first job that exports the answer as an output instead.
  creds:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        run: echo "present=${{ secrets.OPENAI_API_KEY != '' || secrets.OPENROUTER_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
  live-providers:
    needs: creds
    if: needs.creds.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,http]"
      - run: python -m pytest -m live -v
